spring.application.name=spring-lab-01
server.port=8080
app.owner=Sabyr Daryn, IS-2411
logging.level.web=INFO

# Lab 10: the springlab database. Real credentials come from the environment (DB_URL, DB_USERNAME,
# DB_PASSWORD) or from ./config/application.properties, which is git-ignored; the defaults are for a
# local teaching database only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springlab}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# Lab 12, variant 6: fines for late books, in tenge (FinePolicy). 100 a day, never more than 2000.
app.fines.daily-rate=100
app.fines.maximum=2000
